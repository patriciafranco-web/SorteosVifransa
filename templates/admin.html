<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Sorteos Vifran S.A.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería Chart.js para el gráfico circular -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-8">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-extrabold text-amber-400">🔒 Panel de Control - Sorteos Vifran S.A.</h1>
            <button onclick="cerrarSesion()" class="bg-rose-600 hover:bg-rose-700 text-sm font-bold px-4 py-2 rounded transition">Cerrar Sesión</button>
        </header>

        <!-- Crear Nuevo Sorteo con Límite de Boletos -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <h2 class="text-xl font-bold mb-4 text-amber-300">➕ Crear Nuevo Sorteo / Rifa</h2>
            <form id="formNuevoSorteo" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Título del Sorteo</label>
                    <input type="text" id="nuevoTitulo" required placeholder="Ej: Combo iPhone Pro Max" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Precio por Boleto (Gs.)</label>
                    <input type="number" id="nuevoPrecio" required placeholder="2000" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Límite Total de Boletos</label>
                    <input type="number" id="nuevoLimite" required placeholder="5000" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
                </div>
                <div class="md:col-span-3">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-3 rounded text-white transition">Crear Sorteo</button>
                </div>
            </form>
            <div id="resCrearSorteo" class="mt-4 text-center font-semibold"></div>
        </div>

        <!-- Sección de Estadísticas, Control y Gráfico de Recaudación -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-xl font-bold mb-4 text-amber-300">📊 Control de Ganancias por Sorteo</h2>
                <div id="listaSorteosAdmin" class="space-y-4">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 flex flex-col items-center justify-center">
                <h2 class="text-xl font-bold mb-4 text-amber-300 self-start">📈 Distribución de Recaudación Global</h2>
                <div class="w-64 h-64 relative">
                    <canvas id="graficoRecaudacion"></canvas>
                </div>
            </div>
        </div>

        <!-- Validación de Comprobantes y Lotes -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <h2 class="text-xl font-bold mb-4 text-amber-300">🧾 Validación de Comprobantes y Lotes Pendientes</h2>
            <div id="listaLotesPendientes" class="space-y-4">
                <!-- Se llena dinámicamente con las fotos y botones de aprobar -->
            </div>
        </div>

        <!-- Historial Completo de Todas las Boletas Vendidas -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <h2 class="text-xl font-bold mb-4 text-amber-300">📋 Historial General de Boletos Vendidos</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-sm">
                            <th class="p-3">Boleto #</th>
                            <th class="p-3">Comprador</th>
                            <th class="p-3">Cédula / Teléfono</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3">Impreso</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorialBoletos" class="text-sm divide-y divide-slate-700/50">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const passwordAdmin = "vifran2026admin";
        let miGrafico = null;

        async function cargarDatosAdmin() {
            const res = await fetch('/api/admin/datos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario: 'admin', password: passwordAdmin })
            });
            if(res.ok) {
                const data = await res.json();
                
                const estadisticasSorteos = {};
                data.sorteos.forEach(s => {
                    estadisticasSorteos[s.id] = { ...s, aprobadosCount: 0, recaudacion: 0 };
                });

                data.boletos.forEach(b => {
                    if(b.estado === 'Aprobado' && estadisticasSorteos[b.sorteo_id]) {
                        estadisticasSorteos[b.sorteo_id].aprobadosCount++;
                        estadisticasSorteos[b.sorteo_id].recaudacion += estadisticasSorteos[b.sorteo_id].precio;
                    }
                });

                // 1. Renderizar lista de control de sorteos
                const divSorteos = document.getElementById('listaSorteosAdmin');
                divSorteos.innerHTML = '';
                const labelsGrafico = [];
                const datosGrafico = [];
                const coloresGrafico = ['#f59e0b', '#10b981', '#6366f1', '#ec4899', '#3b82f6'];

                Object.values(estadisticasSorteos).forEach((s) => {
                    labelsGrafico.push(s.titulo);
                    datosGrafico.push(s.recaudacion);

                    divSorteos.innerHTML += `
                        <div class="bg-slate-900 p-4 rounded border border-slate-700 flex justify-between items-center">
                            <div>
                                <p class="font-bold text-amber-400">${s.titulo}</p>
                                <p class="text-xs text-slate-400">Aprobados: ${s.aprobadosCount} boletos | Límite: ${s.limite_boletos}</p>
                                <p class="text-sm font-extrabold text-emerald-400 mt-1">Gs. ${s.recaudacion.toLocaleString()}</p>
                                <span class="inline-block mt-2 px-2 py-0.5 rounded text-xs font-bold ${s.estado === 'Activo' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${s.estado}</span>
                            </div>
                            ${s.estado === 'Activo' ? `<button onclick="finalizarSorteo(${s.id})" class="text-xs font-bold text-rose-400 hover:text-rose-300 underline">Finalizar</button>` : ''}
                        </div>`;
                });

                // 2. Renderizar Gráfico Redondo
                const ctx = document.getElementById('graficoRecaudacion').getContext('2d');
                if(miGrafico) miGrafico.destroy();
                miGrafico = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labelsGrafico,
                        datasets: [{ data: datosGrafico, backgroundColor: coloresGrafico.slice(0, labelsGrafico.length), borderWidth: 0 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1', font: { size: 10 } } } }
                    }
                });

                // 3. Renderizar lotes pendientes con comprobantes
                const divPendientes = document.getElementById('listaLotesPendientes');
                divPendientes.innerHTML = '';
                const lotesPendientesMap = {};
                data.boletos.forEach(b => {
                    if(b.estado === 'Pendiente') {
                        if(!lotesPendientesMap[b.lote_id]) {
                            lotesPendientesMap[b.lote_id] = {
                                lote_id: b.lote_id, nombre: b.nombre, cedula: b.cedula,
                                telefono: b.telefono, cantidad: b.cantidad_lote,
                                imagen: b.imagen_comprobante, boletos: []
                            };
                        }
                        lotesPendientesMap[b.lote_id].boletos.push(b.id);
                    }
                });

                const lotesArray = Object.values(lotesPendientesMap);
                if(lotesArray.length === 0) {
                    divPendientes.innerHTML = `<p class="text-slate-400 text-sm text-center py-4">No hay pagos pendientes de aprobación.</p>`;
                } else {
                    lotesArray.forEach(l => {
                        divPendientes.innerHTML += `
                            <div class="bg-slate-900 p-4 rounded border border-slate-700 space-y-3">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <p class="font-bold text-amber-400">${l.nombre} (CI: ${l.cedula})</p>
                                        <p class="text-xs text-slate-400">Tel: ${l.telefono} | Cantidad: ${l.cantidad} boletos</p>
                                        <p class="text-xs text-emerald-400 mt-1">Asignados: #${l.boletos[0]} al #${l.boletos[l.boletos.length-1]}</p>
                                    </div>
                                    <button onclick="aprobarLote(${l.lote_id})" class="bg-emerald-600 hover:bg-emerald-700 text-xs font-bold px-3 py-2 rounded transition">Aprobar</button>
                                </div>
                                ${l.imagen ? `<div class="mt-2"><a href="${l.imagen}" target="_blank"><img src="${l.imagen}" alt="Comprobante" class="w-32 h-32 object-cover rounded border border-slate-700 hover:opacity-80 transition cursor-pointer"></a><p class="text-[10px] text-slate-500 mt-1">Haz clic en la imagen para ampliar</p></div>` : '<p class="text-xs text-rose-400">Sin comprobante adjunto</p>'}
                            </div>`;
                    });
                }

                // 4. Renderizar Historial General de Boletos
                const tablaHistorial = document.getElementById('tablaHistorialBoletos');
                tablaHistorial.innerHTML = '';
                if(data.boletos.length === 0) {
                    tablaHistorial.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No hay boletos registrados aún.</td></tr>`;
                } else {
                    data.boletos.forEach(b => {
                        tablaHistorial.innerHTML += `
                            <tr class="hover:bg-slate-700/30">
                                <td class="p-3 font-bold text-amber-400">#${b.id}</td>
                                <td class="p-3">${b.nombre}</td>
                                <td class="p-3 text-slate-300">CI: ${b.cedula}<br><span class="text-xs text-slate-400">Tel: ${b.telefono}</span></td>
                                <td class="p-3"><span class="px-2 py-0.5 rounded text-xs font-bold ${b.estado === 'Aprobado' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${b.estado}</span></td>
                                <td class="p-3 text-xs">${b.impreso ? '<span class="text-emerald-400 font-bold">Impreso</span>' : '<span class="text-amber-400">Pendiente</span>'}</td>
                            </tr>`;
                    });
                }
            }
        }

        async function aprobarLote(loteId) {
            const res = await fetch(`/api/admin/aprobar-lote/${loteId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario: 'admin', password: passwordAdmin })
            });
            const data = await res.json();
            if(res.ok) {
                alert(data.mensaje);
                cargarDatosAdmin();
            } else {
                alert(data.error || "Error al aprobar lote");
            }
        }

        async function finalizarSorteo(sorteoId) {
            if(!confirm("¿Estás seguro de finalizar este sorteo? Dejará de estar activo en la web principal.")) return;
            const res = await fetch(`/api/admin/finalizar-sorteo/${sorteoId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario: 'admin', password: passwordAdmin })
            });
            const data = await res.json();
            if(res.ok) {
                alert(data.mensaje);
                cargarDatosAdmin();
            } else {
                alert(data.error || "Error al finalizar sorteo");
            }
        }

        cargarDatosAdmin();

        document.getElementById('formNuevoSorteo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/admin/crear-sorteo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    usuario: 'admin',
                    password: passwordAdmin,
                    titulo: document.getElementById('nuevoTitulo').value,
                    precio: parseInt(document.getElementById('nuevoPrecio').value),
                    limite_boletos: parseInt(document.getElementById('nuevoLimite').value)
                })
            });
            const data = await res.json();
            const resDiv = document.getElementById('resCrearSorteo');
            if(res.ok) {
                resDiv.className = "mt-4 text-center font-semibold text-emerald-400";
                resDiv.innerText = data.mensaje;
                document.getElementById('formNuevoSorteo').reset();
                cargarDatosAdmin();
            } else {
                resDiv.className = "mt-4 text-center font-semibold text-rose-400";
                resDiv.innerText = data.error;
            }
        });

        function cerrarSesion() {
            window.location.href = "/";
        }
    </script>
</body>
</html>
