<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Sorteos Vifran S.A.</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-extrabold text-amber-400">🔒 Panel de Control - Sorteos Vifran S.A.</h1>
            <button onclick="cerrarSesion()" class="bg-rose-600 hover:bg-rose-700 text-sm font-bold px-4 py-2 rounded transition">Cerrar Sesión</button>
        </header>

        <!-- Crear Nuevo Sorteo con Límite de Boletos -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 mb-8">
            <h2 class="text-xl font-bold mb-4 text-amber-300">➕ Crear Nuevo Sorteo / Rifa</h2>
            <form id="formNuevoSorteo" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Título del Sorteo</label>
                    <input type="text" id="nuevoTitulo" required placeholder="Ej: Combo iPhone Pro Max" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Precio por Boleto (Gs.)</label>
                    <input type="number" id="nuevoPrecio" required placeholder="2000" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Límite Total de Boletos</label>
                    <input type="number" id="nuevoLimite" required placeholder="5000" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
                </div>
                <div class="md:col-span-3">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-3 rounded text-white transition">Crear Sorteo</button>
                </div>
            </form>
            <div id="resCrearSorteo" class="mt-4 text-center font-semibold"></div>
        </div>

        <!-- Listado y Validación de Ventas / Comprobantes -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-xl font-bold mb-4 text-amber-300">📊 Control de Sorteos Activos</h2>
                <div id="listaSorteosAdmin" class="space-y-4">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-xl font-bold mb-4 text-amber-300">🧾 Validación de Comprobantes y Lotes</h2>
                <div id="listaLotesPendientes" class="space-y-4">
                    <!-- Se llena dinámicamente con las fotos y botones de aprobar -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Contraseña temporal del admin (puedes cambiarla en app.py)
        const passwordAdmin = "vifran2026admin";

        async function cargarDatosAdmin() {
            const res = await fetch('/api/admin/datos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario: 'admin', password: passwordAdmin })
            });
            if(res.ok) {
                const data = await res.json();
                
                // Renderizar sorteos
                const divSorteos = document.getElementById('listaSorteosAdmin');
                divSorteos.innerHTML = '';
                data.sorteos.forEach(s => {
                    divSorteos.innerHTML += `
                        <div class="bg-slate-900 p-4 rounded border border-slate-700 flex justify-between items-center">
                            <div>
                                <p class="font-bold text-amber-400">${s.titulo}</p>
                                <p class="text-xs text-slate-400">Precio: Gs. ${s.precio} | Límite: ${s.limite_boletos} boletos</p>
                                <span class="inline-block mt-2 px-2 py-0.5 rounded text-xs font-bold ${s.estado === 'Activo' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${s.estado}</span>
                            </div>
                        </div>`;
                });
            }
        }
        cargarDatosAdmin();

        document.getElementById('formNuevoSorteo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/admin/crear-sorteo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    usuario: 'admin',
                    password: passwordAdmin,
                    titulo: document.getElementById('nuevoTitulo').value,
                    precio: parseInt(document.getElementById('nuevoPrecio').value),
                    limite_boletos: parseInt(document.getElementById('nuevoLimite').value)
                })
            });
            const data = await res.json();
            const resDiv = document.getElementById('resCrearSorteo');
            if(res.ok) {
                resDiv.className = "mt-4 text-center font-semibold text-emerald-400";
                resDiv.innerText = data.mensaje;
                document.getElementById('formNuevoSorteo').reset();
                cargarDatosAdmin();
            } else {
                resDiv.className = "mt-4 text-center font-semibold text-rose-400";
                resDiv.innerText = data.error;
            }
        });

        function cerrarSesion() {
            window.location.href = "/";
        }
    </script>
</body>
</html>
