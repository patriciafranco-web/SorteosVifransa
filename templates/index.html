<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteos Vifran S.A. - Plataforma Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div class="max-w-xl mx-auto p-6">
        <header class="text-center my-8">
            <h1 class="text-3xl font-extrabold text-amber-400">Sorteos Vifran S.A.</h1>
            <p id="tituloSorteo" class="text-slate-300 mt-2">Cargando sorteo activo...</p>
            <div id="contadorBadge" class="inline-block bg-amber-500/20 text-amber-300 border border-amber-500/50 px-4 py-1 rounded-full text-sm font-semibold mt-4">
                ⏳ Actualizando disponibilidad...
            </div>
        </header>

        <!-- Formulario de Compra -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 mb-8">
            <h2 class="text-xl font-bold mb-4 text-amber-300">🎟️ Comprar Boleto</h2>
            <form id="formCompra" class="space-y-4">
                <input type="hidden" id="sorteoId" value="1">
                <div>
                    <label class="block text-sm font-medium mb-1">Nombre Completo</label>
                    <input type="text" id="nombre" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Cédula de Identidad</label>
                    <input type="text" id="cedula" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Teléfono / WhatsApp</label>
                    <input type="text" id="telefono" required placeholder="Ej: 0981123456" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Cantidad de Boletos (Gs. <span id="precioBoleto">2000</span> c/u)</label>
                    <input type="number" id="cantidad" min="1" value="1" oninput="calcularTotal()" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white font-bold text-amber-400">
                </div>
                <div class="bg-slate-900 p-3 rounded border border-slate-700 text-center">
                    <p class="text-xs text-slate-400">TOTAL A PAGAR:</p>
                    <p id="totalPagar" class="text-xl font-extrabold text-amber-400">Gs. 2.000</p>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Adjuntar Comprobante de Transferencia (Foto)</label>
                    <input type="file" id="fotoComprobante" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-600">
                </div>
                <div class="bg-slate-900 p-4 rounded border border-slate-700 text-sm text-slate-300">
                    <p class="font-bold text-amber-400 mb-1">Datos Bancarios para Transferencia:</p>
                    <p>Banco Familiar / Visión</p>
                    <p>Nro. Cuenta: 123456789</p>
                    <p>Titular: Vifran S.A.</p>
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 font-bold py-3 rounded text-slate-950 transition">Registrar Compra y Participar</button>
            </form>
            <div id="resultadoCompra" class="mt-4 text-center font-semibold"></div>
        </div>

        <!-- Módulo de Consulta Pública -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <h2 class="text-xl font-bold mb-4 text-amber-300">🔍 Consultar Mis Boletos</h2>
            <div class="flex gap-2">
                <input type="text" id="terminoConsulta" placeholder="Ingresa tu Cédula o Teléfono" class="flex-1 bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
                <button onclick="consultarBoletos()" class="bg-indigo-600 hover:bg-indigo-700 font-bold px-4 rounded text-white transition">Buscar</button>
            </div>
            <div id="resultadoConsulta" class="mt-4 space-y-2"></div>
        </div>
    </div>

    <script>
        let precioUnitario = 2000;

        async function cargarSorteoActivo() {
            const res = await fetch('/api/sorteos');
            const data = await res.json();
            if(data.sorteos && data.sorteos.length > 0) {
                const sorteo = data.sorteos[0]; // Toma el primer sorteo activo
                document.getElementById('sorteoId').value = sorteo.id;
                document.getElementById('tituloSorteo').innerText = `¡Gana ${sorteo.titulo} participando hoy!`;
                document.getElementById('precioBoleto').innerText = sorteo.precio.toLocaleString();
                precioUnitario = sorteo.precio;
                document.getElementById('contadorBadge').innerText = `🔥 Quedan ${sorteo.boletos_disponibles} boletos disponibles`;
                calcularTotal();
            } else {
                document.getElementById('tituloSorteo').innerText = "No hay sorteos activos en este momento.";
                document.getElementById('contadorBadge').innerText = "Sorteo finalizado";
            }
        }

        function calcularTotal() {
            const cant = parseInt(document.getElementById('cantidad').value) || 1;
            const total = cant * precioUnitario;
            document.getElementById('totalPagar').innerText = `Gs. ${total.toLocaleString()}`;
        }

        // Convertir la imagen seleccionada a Base64 para guardarla fácilmente
        function convertirImagenABase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('formCompra').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resDiv = document.getElementById('resultadoCompra');
            resDiv.className = "mt-4 text-center font-semibold text-amber-400";
            resDiv.innerText = "Registrando compra...";

            let imagenBase64 = "";
            const fileInput = document.getElementById('fotoComprobante');
            if(fileInput.files.length > 0) {
                try {
                    imagenBase64 = await convertirImagenABase64(fileInput.files[0]);
                } catch(err) {
                    console.error("Error al leer imagen", err);
                }
            }

            const res = await fetch('/api/comprar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sorteo_id: parseInt(document.getElementById('sorteoId').value),
                    nombre: document.getElementById('nombre').value,
                    cedula: document.getElementById('cedula').value,
                    telefono: document.getElementById('telefono').value,
                    cantidad: parseInt(document.getElementById('cantidad').value),
                    imagen_comprobante: imagenBase64
                })
            });
            const data = await res.json();
            
            if(res.ok) {
                resDiv.className = "mt-4 text-center font-semibold text-emerald-400";
                resDiv.innerText = `${data.mensaje} Tus números asignados temporales son: ${data.rango}. ¡Pendiente de aprobación!`;
                document.getElementById('formCompra').reset();
                cargarSorteoActivo();
            } else {
                resDiv.className = "mt-4 text-center font-semibold text-rose-400";
                resDiv.innerText = data.error;
            }
        });

        async function consultarBoletos() {
            const termino = document.getElementById('terminoConsulta').value;
            const res = await fetch('/api/consultar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ termino })
            });
            const data = await res.json();
            const container = document.getElementById('resultadoConsulta');
            container.innerHTML = '';
            if(data.encontrado) {
                data.boletos.forEach(b => {
                    container.innerHTML += `<div class="bg-slate-900 p-3 rounded border border-slate-700 flex justify-between items-center">
                        <div>
                            <p class="font-bold text-amber-400">Boleto #${b.id} (${b.sorteo_titulo || 'Sorteo'})</p>
                            <p class="text-xs text-slate-400">${b.nombre} - Tel: ${b.telefono}</p>
                        </div>
                        <span class="px-2 py-1 rounded text-xs font-bold ${b.estado === 'Aprobado' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500' : 'bg-amber-500/20 text-amber-400 border border-amber-500'}">${b.estado}</span>
                    </div>`;
                });
            } else {
                container.innerHTML = `<p class="text-slate-400 text-center text-sm">${data.mensaje}</p>`;
            }
        }

        // Cargar datos al abrir la página
        cargarSorteoActivo();
        // Actualizar el contador cada 10 segundos automáticamente
        setInterval(cargarSorteoActivo, 10000);
    </script>
</body>
</html>
