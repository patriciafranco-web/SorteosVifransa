<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sorteos Vifran Group S.A.</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-4 md:p-6 font-sans min-h-screen">
    <div class="max-w-6xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-black text-amber-400">🔒 Panel de Control - Vifran Group S.A.</h1>
            <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-xl text-slate-300 transition">Actualizar Datos</button>
        </header>
        
        <!-- Login Box -->
        <div id="loginBox" class="bg-slate-900 p-6 rounded-2xl border border-slate-800 max-w-md shadow-xl mx-auto mt-10">
            <h2 class="text-lg font-bold text-amber-300 mb-4">Iniciar Sesión de Administrador</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Usuario</label>
                    <input type="text" id="userInput" placeholder="Ej: patriciafranco" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Contraseña</label>
                    <input type="password" id="passInput" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <button onclick="cargarPanelAdmin()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition">Ingresar al Sistema</button>
            </div>
        </div>

        <!-- Panel de Administración (Oculto al inicio) -->
        <div id="adminPanel" class="hidden space-y-6">
            
            <!-- Crear Nuevo Sorteo -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h2 class="text-lg font-bold text-amber-300 mb-4">➕ Crear Nuevo Sorteo / Rifa</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="nuevoTitulo" placeholder="Título (Ej: Sorteo Moto 125cc)" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-white">
                    <input type="number" id="nuevoPrecio" placeholder="Precio por boleto (Gs.)" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-white">
                    <button onclick="crearSorteo()" class="bg-emerald-600 hover:bg-emerald-500 font-bold p-3 rounded-xl text-white transition">Crear Sorteo</button>
                </div>
            </div>

            <!-- Listado de Sorteos Activos -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h2 class="text-lg font-bold text-amber-300 mb-4">📋 Sorteos Registrados</h2>
                <div id="listaSorteosAdmin" class="space-y-3"></div>
            </div>

            <!-- Listado de Boletos por Aprobar -->
            <div class="bg-slate-900 rounded-2xl border border-slate-800 shadow-xl overflow-hidden">
                <div class="p-4 bg-slate-850 border-b border-slate-800">
                    <h2 class="text-lg font-bold text-amber-300">🎟️ Validación de Comprobantes y Boletos Pendientes</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-850 text-slate-400 border-b border-slate-800 uppercase text-xs tracking-wider">
                                <th class="p-4">ID / Lote</th>
                                <th class="p-4">Sorteo</th>
                                <th class="p-4">Comprador</th>
                                <th class="p-4">Cédula / Tel</th>
                                <th class="p-4">Comprobante</th>
                                <th class="p-4">Estado</th>
                                <th class="p-4">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBoletos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let adminUser = "";
        let adminPassword = "";

        async function cargarPanelAdmin() {
            adminUser = document.getElementById('userInput').value.trim();
            adminPassword = document.getElementById('passInput').value.trim();
            
            const res = await fetch('/api/admin/datos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario: adminUser, password: adminPassword })
            });
            if(res.ok) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                const data = await res.json();
                renderizarTodo(data);
            } else {
                alert('Usuario o contraseña incorrectos');
            }
        }

        async function crearSorteo() {
            const titulo = document.getElementById('nuevoTitulo').value;
            const precio = document.getElementById('nuevoPrecio').value;
            const res = await fetch('/api/admin/crear-sorteo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario: adminUser, password: adminPassword, titulo, precio: Number(precio) })
            });
            const data = await res.json();
            alert(data.mensaje);
            document.getElementById('nuevoTitulo').value = '';
            document.getElementById('nuevoPrecio').value = '';
            cargarPanelAdmin();
        }

        async function finalizarSorteo(sorteoId) {
            if(!confirm("¿Estás seguro de finalizar este sorteo?")) return;
            const res = await fetch(`/api/admin/finalizar-sorteo/${sorteoId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario: adminUser, password: adminPassword })
            });
            const data = await res.json();
            alert(data.mensaje);
            cargarPanelAdmin();
        }

        async function aprobarBoleto(id, sorteoId) {
            const res = await fetch(`/api/admin/aprobar/${id}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario: adminUser, password: adminPassword, sorteo_id: sorteoId })
            });
            const data = await res.json();
            alert(data.mensaje);
            cargarPanelAdmin();
        }

        function renderizarTodo(data) {
            const listaSorteos = document.getElementById('listaSorteosAdmin');
            listaSorteos.innerHTML = '';
            data.sorteos.forEach(s => {
                listaSorteos.innerHTML += `
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center text-sm">
                        <div>
                            <p class="font-bold text-amber-400">${s.titulo} - Gs. ${s.precio.toLocaleString()}</p>
                            <p class="text-xs text-slate-400">Estado: <span class="${s.estado === 'Activo' ? 'text-emerald-400 font-bold' : 'text-rose-400'}">${s.estado}</span></p>
                        </div>
                        ${s.estado === 'Activo' ? `<button onclick="finalizarSorteo(${s.id})" class="bg-rose-600 hover:bg-rose-500 px-3 py-1.5 rounded-xl text-xs font-bold text-white transition">Finalizar Sorteo</button>` : ''}
                    </div>`;
            });

            const tbody = document.getElementById('tablaBoletos');
            tbody.innerHTML = '';
            
            const sorteosMap = {};
            data.sorteos.forEach(s => sorteosMap[s.id] = s.titulo);

            data.boletos.forEach(b => {
                const tituloSorteo = sorteosMap[b.sorteo_id] || "Sorteo General";
                
                // Manejar comprobante (puede ser URL de Green API o base64 de la web)
                let comprobanteHtml = '<span class="text-rose-400 text-xs">Sin comprobante</span>';
                if(b.imagen_comprobante) {
                    if(b.imagen_comprobante.startsWith('http')) {
                        comprobanteHtml = `<a href="${b.imagen_comprobante}" target="_blank" class="text-amber-400 font-bold underline hover:text-amber-300 text-xs">🔍 Ver Comprobante (WhatsApp)</a>`;
                    } else {
                        comprobanteHtml = `<a href="${b.imagen_comprobante}" target="_blank" class="text-emerald-400 font-bold underline hover:text-emerald-300 text-xs">🔍 Ver Comprobante (Web)</a>`;
                    }
                }

                tbody.innerHTML += `<tr class="border-b border-slate-800 hover:bg-slate-850/50">
                    <td class="p-4 font-bold text-amber-400">#${b.id} <span class="text-xs text-slate-500 font-normal">(Lote ${b.lote_id})</span></td>
                    <td class="p-4 text-slate-300">${tituloSorteo}</td>
                    <td class="p-4 font-medium">${b.nombre}</td>
                    <td class="p-4 text-slate-400 text-xs">${b.cedula}<br><span class="text-slate-500">${b.telefono}</span></td>
                    <td class="p-4">${comprobanteHtml}</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-lg text-xs font-bold ${b.estado === 'Aprobado' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/10 text-amber-400 border border-amber-500/30'}">${b.estado}</span></td>
                    <td class="p-4">
                        ${b.estado === 'Pendiente' ? `<button onclick="aprobarBoleto(${b.id}, ${b.sorteo_id})" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-xl text-xs font-bold text-white transition">Aprobar</button>` : '<span class="text-xs text-slate-500">Aprobado</span>'}
                    </td>
                </tr>`;
            });
        }
    </script>
</body>
</html>
