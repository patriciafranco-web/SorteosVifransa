<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vifran Group S.A. - Sorteos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
        <h1 class="text-xl font-bold text-amber-400 mb-4 text-center">🎟️ Sorteos Vifran Group S.A.</h1>
        
        <form id="formCompra" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Seleccionar Sorteo:</label>
                <select id="selectSorteo" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white">
                    <option value="1">Gran Sorteo Camioneta 0km</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre y Apellido:</label>
                <input type="text" id="nombre" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Cédula de Identidad:</label>
                <input type="text" id="cedula" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Teléfono (WhatsApp):</label>
                <input type="text" id="telefono" placeholder="Ej: 595981047851" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Método de Pago:</label>
                <select id="metodoPago" onchange="mostrarOpcionesPago()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white">
                    <option value="Transferencia Directa">Transferencia Bancaria / ueno / Eko</option>
                    <option value="Cripto (USDT)">Binance Pay (USDT)</option>
                </select>
            </div>

            <!-- Bloque Opción Binance Pay con Conversión Automática -->
            <div id="infoCrypto" class="hidden bg-slate-950 p-4 rounded-xl border border-slate-800 text-sm text-slate-300 space-y-3">
                <p class="font-bold text-amber-400">🪙 Pago vía Binance Pay (USDT):</p>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 text-xs space-y-1">
                    <p class="text-emerald-400 font-bold">Monto exacto a enviar: <span id="montoUSDT" class="text-white text-sm font-mono">6.50</span> USDT</p>
                    <p class="text-slate-400">📧 Correo: <span class="text-white">patricia99franco@gmail.com</span></p>
                    <p class="text-slate-400">🆔 Binance ID: <span class="text-white">40280723</span></p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Ingresa el Nro. de Orden o ID de Transacción de Binance:</label>
                    <input type="text" id="hashCrypto" placeholder="Ej: 8493029102" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                </div>
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl transition duration-200">
                Comprar Boletos
            </button>
        </form>

        <div id="resultadoCompra" class="mt-4 text-center text-sm font-semibold"></div>
    </div>

    <script>
        const TASA_USDT_GS = 7800; 
        const PRECIO_BOLETO_GS = 50000;

        function mostrarOpcionesPago() {
            const metodo = document.getElementById('metodoPago').value;
            const infoCrypto = document.getElementById('infoCrypto');
            
            if (metodo.includes('Cripto')) {
                infoCrypto.classList.remove('hidden');
                let totalUSDT = (PRECIO_BOLETO_GS / TASA_USDT_GS).toFixed(2);
                document.getElementById('montoUSDT').innerText = totalUSDT;
            } else {
                infoCrypto.classList.add('hidden');
            }
        }

        document.getElementById('formCompra').addEventListener('submit', async (e) => {
            e.preventDefault();
            const metodo = document.getElementById('metodoPago').value;
            const detallePagoFinal = metodo.includes('Cripto') 
                ? document.getElementById('hashCrypto').value 
                : 'Transferencia Directa';

            const res = await fetch('/api/comprar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sorteo_id: document.getElementById('selectSorteo').value,
                    nombre: document.getElementById('nombre').value,
                    cedula: document.getElementById('cedula').value,
                    telefono: document.getElementById('telefono').value,
                    metodo_pago: metodo,
                    detalle_pago: detallePagoFinal
                })
            });
            const data = await res.json();
            const resDiv = document.getElementById('resultadoCompra');
            if(res.ok) {
                resDiv.className = "mt-4 text-center text-sm font-semibold text-emerald-400";
                resDiv.innerText = `${data.mensaje} Número asignado temporalmente: #${data.boleto.id}`;
                document.getElementById('formCompra').reset();
                mostrarOpcionesPago();
            } else {
                resDiv.className = "mt-4 text-center text-sm font-semibold text-rose-400";
                resDiv.innerText = data.error;
            }
        });
    </script>
</body>
</html>
