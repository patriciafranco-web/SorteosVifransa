<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impresión Ticket Vifran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería local ultra rápida para generar QR reales sin depender de llamadas de red lentas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @media print {
            @page {
                margin: 0;
                size: 58mm auto;
            }
            body {
                margin: 0;
                padding: 1px;
                font-family: 'Courier New', monospace;
                font-size: 10px;
                width: 52mm;
                color: black;
                line-height: 1.1;
            }
            .no-print { display: none !important; }
            .center { text-align: center; }
            .logo { font-size: 14px; font-weight: bold; text-transform: uppercase; }
            .sub-logo { font-size: 7px; text-transform: uppercase; margin-bottom: 2px; }
            .line { border-bottom: 1px dashed black; margin: 3px 0; }
            .bold { font-weight: bold; }
            
            /* Contenedor del QR real */
            .qr-container {
                display: flex;
                justify-content: center;
                margin: 4px 0;
            }
            .qr-container canvas, .qr-container img {
                width: 70px !important;
                height: 70px !important;
                display: block;
            }

            .numero-grande { font-size: 18px; font-weight: bold; text-align: center; margin: 3px 0; padding: 2px; border: 2px dashed black; }
            
            .ticket-individual { 
                page-break-after: always; 
                break-after: page; 
                padding-bottom: 12px;
            }
        }
        body { font-family: monospace; font-size: 12px; padding: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-center min-h-screen p-6 font-sans">

    <!-- BOTÓN DE ACTIVACIÓN INICIAL -->
    <div id="setupModal" class="no-print fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-amber-500/50 p-8 rounded-2xl max-w-md text-center shadow-2xl space-y-4">
            <h2 class="text-xl font-black text-amber-400">🖨️ Activar Impresión Automática</h2>
            <p class="text-sm text-slate-300">Haz clic una sola vez para habilitar la impresión automática en esta laptop.</p>
            <button onclick="activarSistema()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg text-lg">
                🚀 Activar Sistema Ahora
            </button>
        </div>
    </div>

    <!-- PANEL DE ESPERA -->
    <div class="no-print max-w-md w-full bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl text-center space-y-4">
        <h1 class="text-xl font-bold text-amber-400">🎫 Sistema de Impresión Vifran</h1>
        <div class="flex items-center justify-center space-x-2">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
            <span id="estadoTexto" class="text-sm font-semibold text-emerald-400">Conectado y esperando tickets...</span>
        </div>
        <p class="text-xs text-slate-500">Mantén esta pestaña abierta.</p>
    </div>

    <script>
        let sistemaActivo = false;

        function activarSistema() {
            sistemaActivo = true;
            document.getElementById('setupModal').classList.add('hidden');
        }

        async function verificarPendientes() {
            if (!sistemaActivo) return;
            try {
                const res = await fetch('/api/pendientes-impresion');
                if (res.ok) {
                    const pendientes = await res.json();
                    if (pendientes.length > 0) {
                        for (let boleto of pendientes) {
                            imprimirBoletosIndividuales(boleto);
                            await fetch(`/api/marcar-impreso/${boleto.id}`, { method: 'POST' });
                        }
                    }
                }
            } catch (e) { console.error("Error:", e); }
        }

        function imprimirBoletosIndividuales(boleto) {
            const ventanaImpresion = window.open('', '_blank', 'width=300,height=800');
            const numeros = boleto.numeros_asignados || [boleto.id];
            
            // Creamos un identificador único para los contenedores de los QR
            let tiquetsHtml = '';
            numeros.forEach((num, index) => {
                tiquetsHtml += `
                    <div class="ticket-individual">
                        <div class="center logo">Sorteos Vifran</div>
                        <div class="center sub-logo">Group S.A.</div>
                        <div class="line"></div>
                        <div>Sorteo: ${boleto.sorteo_titulo || 'Sorteo'}</div>
                        <div class="center">NUMERO DE BOLETO:</div>
                        <div class="numero-grande">#${String(num).padStart(4, '0')}</div>
                        <div class="line"></div>
                        <div>Cliente: ${boleto.nombre}</div>
                        <div>CI: ${boleto.cedula} | Cel: ${boleto.telefono}</div>
                        <div>Fecha: ${boleto.fecha_venta || 'Reciente'}</div>
                        <div class="line"></div>
                        
                        <!-- Contenedor donde se dibujará el QR real -->
                        <div class="qr-container" id="qr-${num}-${index}"></div>
                        
                        <div class="center bold">MUCHA SUERTE!</div>
                        <div class="center">Gracias por participar.</div>
                    </div>
                `;
            });

            ventanaImpresion.document.write(`
                <html>
                <head>
                    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
                    <style>
                        @page { margin: 0; size: 58mm auto; }
                        body { margin: 0; padding: 1px; font-family: 'Courier New', monospace; font-size: 10px; width: 52mm; color: black; line-height: 1.1; }
                        .center { text-align: center; }
                        .logo { font-size: 14px; font-weight: bold; text-transform: uppercase; }
                        .sub-logo { font-size: 7px; text-transform: uppercase; margin-bottom: 2px; }
                        .line { border-bottom: 1px dashed black; margin: 3px 0; }
                        .bold { font-weight: bold; }
                        .qr-container { display: flex; justify-content: center; margin: 4px 0; }
                        .qr-container canvas, .qr-container img { width: 70px !important; height: 70px !important; display: block; }
                        .numero-grande { font-size: 18px; font-weight: bold; text-align: center; margin: 3px 0; padding: 2px; border: 2px dashed black; }
                        .ticket-individual { page-break-after: always; break-after: page; padding-bottom: 12px; }
                    </style>
                </head>
                <body>
                    ${tiquetsHtml}
                    <script>
                        // Generar los QR reales de manera instantánea en la memoria local
                        window.onload = function() {
                            const numerosList = ${JSON.stringify(numeros)};
                            numerosList.forEach((num, index) => {
                                const el = document.getElementById('qr-' + num + '-' + index);
                                if (el) {
                                    new QRCode(el, {
                                        text: "https://sorteosvifransa.onrender.com/validar/" + num,
                                        width: 70,
                                        height: 70,
                                        colorDark : "#000000",
                                        colorLight : "#ffffff",
                                        correctLevel : QRCode.CorrectLevel.L
                                    });
                                }
                            });

                            // Esperar medio segundo a que se rendericen los QR y disparar la impresión
                            setTimeout(() => {
                                window.print();
                                window.close();
                            }, 500);
                        };
                    <\/script>
                </body>
                </html>
            `);
            ventanaImpresion.document.close();
            ventanaImpresion.focus();
        }

        setInterval(verificarPendientes, 4000);
    </script>
</body>
</html>
